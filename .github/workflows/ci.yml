name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

# A superseded run tells you nothing a newer one does not, and the suite spends
# most of its wall clock compiling Go and driving real Socket.IO connections.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The whitespace gate below diffs against the base commit, which is
          # only in the clone at full depth.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than `latest`: the generator's output is compared
          # byte-for-byte below, so the runtime that produces it is part of what
          # this workflow holds still.
          bun-version: 1.3.11

      # The suite is cross-language: it generates Go, then compiles it, vets it
      # with no analyzer excluded, and runs it under -race against the real
      # zishang520 transport. Without a Go toolchain those tests fail rather
      # than skip, which is the point.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tests/fixtures/**/go.sum

      - name: Install dependencies
        # Frozen: CI resolves exactly what bun.lock records, so a dependency
        # cannot drift into the release candidate between commit and merge.
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run check

      # Generation has to be a pure function of the contract: same input, same
      # bytes. Regenerating everything and finding the tree untouched proves the
      # checked-in output is what this commit actually emits. `git status`
      # rather than `git diff` so a file that appears also counts as drift.
      - name: Examples regenerate byte-for-byte
        run: |
          bun run generate:examples
          drift="$(git status --porcelain)"
          if [ -n "$drift" ]; then
            echo "Regenerating changed the tree:"
            echo "$drift"
            git diff
            exit 1
          fi

      - name: Whitespace is clean
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # An all-zero BASE is a branch's first push, which has no predecessor
          # to diff against.
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              echo "No base commit to diff against; skipping."
              ;;
            *)
              git diff --check "$BASE" HEAD
              ;;
          esac
