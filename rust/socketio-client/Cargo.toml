[package]
name = "socketrpc-socketio-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Socket.IO v5 / Engine.IO v4 WebSocket client that the Rust clients generated by socketrpc-gen are written against."
license = "MIT"
repository = "https://github.com/nguyenvanduocit/socketrpc-gen"
publish = false

[features]
default = []
# wss:// support. Off by default so a ws:// client builds without a TLS stack;
# pick the one your platform already carries.
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["tokio-tungstenite/native-tls"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tokio = { version = "1.40", features = ["sync", "time", "rt", "macros", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
url = "2.5"

[dev-dependencies]
axum = "0.8"
socketioxide = "0.18"
tokio = { version = "1.40", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
